name: Deploy Phase 1 - Core Infrastructure

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "infra/docker-compose/**"
      - "services/**"
      - "packages/**"
      - ".github/workflows/deploy-phase1.yml"
  pull_request:
    paths:
      - "infra/docker-compose/**"
      - "services/**"
      - "packages/**"
      - ".github/workflows/deploy-phase1.yml"

  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

jobs:
  # ============================================================================
  # UNIT + INTEGRATION TESTS (real PostgreSQL, migrations applied)
  # ============================================================================
  test:
    name: Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: enterprise_rag
          POSTGRES_USER: rag_admin
          POSTGRES_PASSWORD: ci-admin-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag_admin -d enterprise_rag"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGPASSWORD: ci-admin-password
      POSTGRES_USER: rag_admin
      POSTGRES_DB: enterprise_rag
      APP_DB_PASSWORD: ci-app-password
      TEST_DATABASE_URL: postgresql://rag_app:ci-app-password@localhost:5432/enterprise_rag
      TEST_ADMIN_DATABASE_URL: postgresql://rag_admin:ci-admin-password@localhost:5432/enterprise_rag

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply baseline schema and migrations
        run: |
          psql -X -q -v ON_ERROR_STOP=1 -U rag_admin -d enterprise_rag \
            -f infra/docker-compose/postgres/init/01-init-database.sql
          bash infra/docker-compose/postgres/migrations/migrate.sh
          echo "Re-running migrations must be a no-op:"
          bash infra/docker-compose/postgres/migrations/migrate.sh

      - name: adaptive-tuning package
        working-directory: packages/adaptive-tuning
        run: |
          pip install -q pytest==7.4.4
          PYTHONPATH=. python -m pytest -q

      - name: canonical-db-agent
        working-directory: services/canonical-db-agent
        run: |
          python -m venv .venv && . .venv/bin/activate
          pip install -q -r requirements-dev.txt
          python -m pytest -q

      - name: auth-acl-agent
        working-directory: services/auth-acl-agent
        run: |
          python -m venv .venv && . .venv/bin/activate
          pip install -q -r requirements-dev.txt
          python -m pytest -q

  # ============================================================================
  # COMPOSE SMOKE TEST (images build, stack boots, RLS enforced)
  # ============================================================================
  build-and-test:
    name: Build and Smoke Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file for testing
        run: |
          cd infra/docker-compose
          cp .env.example .env
          set_env() { sed -i "s|^$1=.*|$1=$2|" .env; }
          set_env POSTGRES_PASSWORD "$(openssl rand -hex 16)"
          set_env APP_DB_PASSWORD "$(openssl rand -hex 16)"
          set_env MINIO_ROOT_PASSWORD "$(openssl rand -hex 16)"
          set_env REDIS_PASSWORD "$(openssl rand -hex 16)"
          set_env SECRET_KEY "$(openssl rand -hex 32)"
          set_env POSTGRES_PORT 5433
          set_env REDIS_PORT 6380
          set_env OIDC_PROVIDER_URL https://test.example.com/realms/test
          set_env OIDC_CLIENT_ID test-client-id
          set_env OIDC_CLIENT_SECRET test-client-secret

      - name: Validate docker-compose configuration
        working-directory: infra/docker-compose
        run: docker compose config --quiet

      - name: Build and start the stack
        working-directory: infra/docker-compose
        run: |
          docker compose up -d --build
          timeout 180 bash -c 'until [ "$(docker compose ps --format "{{.Service}} {{.Health}}" \
              | grep -E "^(postgres|redis|canonical-db-api|auth-acl-api) " | grep -vc " healthy$")" = "0" ]; do
            docker compose ps; sleep 5;
          done'
          docker compose ps

      - name: Verify schema, migrations and RLS
        working-directory: infra/docker-compose
        run: |
          PSQL="docker compose exec -T postgres psql -X -tA -U rag_admin -d enterprise_rag"
          $PSQL -c "SELECT string_agg(version, ',' ORDER BY version) FROM schema_migrations" | tee /dev/stderr \
            | grep -q "0002_security_and_canonical_model,0003_self_improvement"
          for t in tenants users documents document_chunks access_policies retrieval_audit_logs user_feedback \
                   tuning_parameters tuning_experiments evaluation_cases; do
            $PSQL -c "SELECT to_regclass('public.$t') IS NOT NULL" | grep -q t || { echo "missing $t"; exit 1; }
          done
          # rag_app with no tenant context must see nothing (fail-closed RLS).
          APP_DB_PASSWORD=$(grep '^APP_DB_PASSWORD=' .env | cut -d= -f2-)
          visible=$(docker compose exec -T -e PGPASSWORD="$APP_DB_PASSWORD" postgres \
            psql -X -tA -h localhost -U rag_app -d enterprise_rag -c "SELECT count(*) FROM users")
          [ "$visible" = "0" ] || { echo "RLS not enforced: rag_app saw $visible users"; exit 1; }
          echo "✅ schema, migrations and RLS verified"

      - name: Service health
        working-directory: infra/docker-compose
        run: |
          curl -fsS http://127.0.0.1:8001/health
          curl -fsS http://127.0.0.1:8002/health
          # canonical-db API must reject unauthenticated calls
          code=$(curl -s -o /dev/null -w "%{http_code}" -H "X-Tenant-ID: default" http://127.0.0.1:8001/api/v1/documents)
          [ "$code" = "401" ] || { echo "expected 401, got $code"; exit 1; }

      - name: Logs on failure
        if: failure()
        working-directory: infra/docker-compose
        run: docker compose logs --tail=200

      - name: Stop services
        if: always()
        working-directory: infra/docker-compose
        run: docker compose down -v

  # ============================================================================
  # DEPLOY TO STAGING
  # ============================================================================
  deploy-staging:
    name: Deploy to Staging
    needs: [test, build-and-test]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/develop' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging'))
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.STAGING_SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Copy files to staging server
        env:
          SERVER_HOST: ${{ secrets.STAGING_SERVER_HOST }}
          SERVER_USER: ${{ secrets.STAGING_SERVER_USER }}
          DEPLOY_PATH: ${{ secrets.STAGING_DEPLOY_PATH }}
        run: |
          ssh ${SERVER_USER}@${SERVER_HOST} "mkdir -p ${DEPLOY_PATH}"
          # --delete must not remove server-side state (backups, .env) and
          # local secret files must never be shipped.
          rsync -avz --delete \
            --exclude='.git' --exclude='__pycache__' \
            --exclude='.env' --exclude='.env.*' --exclude='backups/' --exclude='secrets/' \
            --exclude='services/' \
            infra/docker-compose/ ${SERVER_USER}@${SERVER_HOST}:${DEPLOY_PATH}/
          rsync -avz --delete \
            --exclude='.git' --exclude='__pycache__' --exclude='*.pyc' \
            --exclude='.pytest_cache' --exclude='.venv' --exclude='tests/' \
            services/ ${SERVER_USER}@${SERVER_HOST}:${DEPLOY_PATH}/services/

      - name: Create .env file on server
        env:
          SERVER_HOST: ${{ secrets.STAGING_SERVER_HOST }}
          SERVER_USER: ${{ secrets.STAGING_SERVER_USER }}
          DEPLOY_PATH: ${{ secrets.STAGING_DEPLOY_PATH }}
        run: |
          ssh ${SERVER_USER}@${SERVER_HOST} "umask 077 && cat > ${DEPLOY_PATH}/.env << 'EOF'
          ENVIRONMENT=staging
          SERVICES_DIR=./services
          BIND_ADDRESS=127.0.0.1
          POSTGRES_DB=${{ secrets.STAGING_POSTGRES_DB || 'enterprise_rag' }}
          POSTGRES_USER=${{ secrets.STAGING_POSTGRES_USER || 'rag_admin' }}
          POSTGRES_PASSWORD=${{ secrets.STAGING_POSTGRES_PASSWORD }}
          POSTGRES_PORT=${{ secrets.STAGING_POSTGRES_PORT || '5433' }}
          APP_DB_USER=${{ secrets.STAGING_APP_DB_PASSWORD != '' && 'rag_app' || 'rag_admin' }}
          APP_DB_PASSWORD=${{ secrets.STAGING_APP_DB_PASSWORD }}
          DB_POOL_SIZE=20
          DB_MAX_OVERFLOW=10
          DB_POOL_TIMEOUT=30
          MINIO_IMAGE=${{ secrets.STAGING_MINIO_IMAGE || 'minio/minio:latest' }}
          MINIO_ROOT_USER=${{ secrets.STAGING_MINIO_ROOT_USER || 'minioadmin' }}
          MINIO_ROOT_PASSWORD=${{ secrets.STAGING_MINIO_ROOT_PASSWORD }}
          MINIO_API_PORT=${{ secrets.STAGING_MINIO_API_PORT || '9000' }}
          MINIO_CONSOLE_PORT=${{ secrets.STAGING_MINIO_CONSOLE_PORT || '9001' }}
          MINIO_BROWSER_URL=${{ secrets.STAGING_MINIO_BROWSER_URL }}
          REDIS_PASSWORD=${{ secrets.STAGING_REDIS_PASSWORD }}
          REDIS_PORT=${{ secrets.STAGING_REDIS_PORT || '6380' }}
          CACHE_TTL=300
          SECRET_KEY=${{ secrets.STAGING_SECRET_KEY }}
          SERVICE_API_KEYS=${{ secrets.STAGING_SERVICE_API_KEYS }}
          OIDC_PROVIDER_URL=${{ secrets.STAGING_OIDC_PROVIDER_URL }}
          OIDC_CLIENT_ID=${{ secrets.STAGING_OIDC_CLIENT_ID }}
          OIDC_CLIENT_SECRET=${{ secrets.STAGING_OIDC_CLIENT_SECRET }}
          OIDC_AUDIENCES=${{ secrets.STAGING_OIDC_AUDIENCES }}
          ALLOWED_ORIGINS=${{ secrets.STAGING_ALLOWED_ORIGINS }}
          LOG_LEVEL=INFO
          CANONICAL_DB_API_PORT=${{ secrets.STAGING_CANONICAL_DB_API_PORT || '8001' }}
          AUTH_ACL_API_PORT=${{ secrets.STAGING_AUTH_ACL_API_PORT || '8002' }}
          API_WORKERS=4
          EOF"

      - name: Migrate and deploy
        env:
          SERVER_HOST: ${{ secrets.STAGING_SERVER_HOST }}
          SERVER_USER: ${{ secrets.STAGING_SERVER_USER }}
          DEPLOY_PATH: ${{ secrets.STAGING_DEPLOY_PATH }}
        run: |
          ssh ${SERVER_USER}@${SERVER_HOST} "cd ${DEPLOY_PATH} && \
            docker compose up -d postgres redis minio && \
            timeout 120 bash -c 'until docker compose exec -T postgres pg_isready -U rag_admin; do sleep 3; done' && \
            docker compose exec -T postgres bash /migrations/migrate.sh && \
            docker compose up -d --build --remove-orphans && \
            docker compose ps"

      - name: Run health checks
        env:
          STAGING_URL: ${{ secrets.STAGING_URL }}
        run: |
          sleep 15
          curl -f ${STAGING_URL}/api/canonical-db/health || echo "⚠️ Canonical DB API not responding"
          curl -f ${STAGING_URL}/api/auth-acl/health || echo "⚠️ Auth ACL API not responding"

  # ============================================================================
  # DEPLOY TO PRODUCTION
  # ============================================================================
  deploy-production:
    name: Deploy to Production
    needs: [test, build-and-test]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production'))
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.PRODUCTION_SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Create backup before deployment
        env:
          SERVER_HOST: ${{ secrets.PRODUCTION_SERVER_HOST }}
          SERVER_USER: ${{ secrets.PRODUCTION_SERVER_USER }}
          DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
        run: |
          if ssh ${SERVER_USER}@${SERVER_HOST} "cd ${DEPLOY_PATH} 2>/dev/null && docker compose ps postgres 2>/dev/null | grep -q 'Up'"; then
            BACKUP_DIR="${DEPLOY_PATH}/backups/$(date +%Y%m%d_%H%M%S)"
            ssh ${SERVER_USER}@${SERVER_HOST} "
              mkdir -p ${BACKUP_DIR} && chmod 700 ${DEPLOY_PATH}/backups && \
              cd ${DEPLOY_PATH} && \
              docker compose exec -T postgres pg_dump -U rag_admin -Fc enterprise_rag > ${BACKUP_DIR}/database.dump && \
              echo '✅ Database backup created: ${BACKUP_DIR}/database.dump'
            "
          else
            echo "⚠️ No existing deployment found, skipping backup (fresh deployment)"
          fi

      - name: Copy files to production server
        env:
          SERVER_HOST: ${{ secrets.PRODUCTION_SERVER_HOST }}
          SERVER_USER: ${{ secrets.PRODUCTION_SERVER_USER }}
          DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
        run: |
          ssh ${SERVER_USER}@${SERVER_HOST} "mkdir -p ${DEPLOY_PATH}"
          rsync -avz --delete \
            --exclude='.git' --exclude='__pycache__' \
            --exclude='.env' --exclude='.env.*' --exclude='backups/' --exclude='secrets/' \
            --exclude='services/' \
            infra/docker-compose/ ${SERVER_USER}@${SERVER_HOST}:${DEPLOY_PATH}/
          rsync -avz --delete \
            --exclude='.git' --exclude='__pycache__' --exclude='*.pyc' \
            --exclude='.pytest_cache' --exclude='.venv' --exclude='tests/' \
            services/ ${SERVER_USER}@${SERVER_HOST}:${DEPLOY_PATH}/services/

      - name: Create .env file on server
        env:
          SERVER_HOST: ${{ secrets.PRODUCTION_SERVER_HOST }}
          SERVER_USER: ${{ secrets.PRODUCTION_SERVER_USER }}
          DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
        run: |
          ssh ${SERVER_USER}@${SERVER_HOST} "umask 077 && cat > ${DEPLOY_PATH}/.env << 'EOF'
          ENVIRONMENT=production
          SERVICES_DIR=./services
          BIND_ADDRESS=127.0.0.1
          POSTGRES_DB=${{ secrets.PRODUCTION_POSTGRES_DB || 'enterprise_rag' }}
          POSTGRES_USER=${{ secrets.PRODUCTION_POSTGRES_USER || 'rag_admin' }}
          POSTGRES_PASSWORD=${{ secrets.PRODUCTION_POSTGRES_PASSWORD }}
          POSTGRES_PORT=${{ secrets.PRODUCTION_POSTGRES_PORT || '5433' }}
          APP_DB_USER=${{ secrets.PRODUCTION_APP_DB_PASSWORD != '' && 'rag_app' || 'rag_admin' }}
          APP_DB_PASSWORD=${{ secrets.PRODUCTION_APP_DB_PASSWORD }}
          DB_POOL_SIZE=20
          DB_MAX_OVERFLOW=10
          DB_POOL_TIMEOUT=30
          MINIO_IMAGE=${{ secrets.PRODUCTION_MINIO_IMAGE || 'minio/minio:latest' }}
          MINIO_ROOT_USER=${{ secrets.PRODUCTION_MINIO_ROOT_USER || 'minioadmin' }}
          MINIO_ROOT_PASSWORD=${{ secrets.PRODUCTION_MINIO_ROOT_PASSWORD }}
          MINIO_API_PORT=${{ secrets.PRODUCTION_MINIO_API_PORT || '9310' }}
          MINIO_CONSOLE_PORT=${{ secrets.PRODUCTION_MINIO_CONSOLE_PORT || '9311' }}
          MINIO_BROWSER_URL=${{ secrets.PRODUCTION_MINIO_BROWSER_URL || 'https://storage.igwilo.com' }}
          REDIS_PASSWORD=${{ secrets.PRODUCTION_REDIS_PASSWORD }}
          REDIS_PORT=${{ secrets.PRODUCTION_REDIS_PORT || '6380' }}
          CACHE_TTL=300
          SECRET_KEY=${{ secrets.PRODUCTION_SECRET_KEY }}
          SERVICE_API_KEYS=${{ secrets.PRODUCTION_SERVICE_API_KEYS }}
          OIDC_PROVIDER_URL=${{ secrets.PRODUCTION_OIDC_PROVIDER_URL }}
          OIDC_CLIENT_ID=${{ secrets.PRODUCTION_OIDC_CLIENT_ID }}
          OIDC_CLIENT_SECRET=${{ secrets.PRODUCTION_OIDC_CLIENT_SECRET }}
          OIDC_AUDIENCES=${{ secrets.PRODUCTION_OIDC_AUDIENCES }}
          ALLOWED_ORIGINS=${{ secrets.PRODUCTION_ALLOWED_ORIGINS }}
          LOG_LEVEL=INFO
          CANONICAL_DB_API_PORT=${{ secrets.PRODUCTION_CANONICAL_DB_API_PORT || '9401' }}
          AUTH_ACL_API_PORT=${{ secrets.PRODUCTION_AUTH_ACL_API_PORT || '9402' }}
          API_WORKERS=4
          EOF"

      - name: Migrate and deploy
        env:
          SERVER_HOST: ${{ secrets.PRODUCTION_SERVER_HOST }}
          SERVER_USER: ${{ secrets.PRODUCTION_SERVER_USER }}
          DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
        run: |
          ssh ${SERVER_USER}@${SERVER_HOST} "cd ${DEPLOY_PATH} && \
            docker compose pull postgres redis && \
            docker compose up -d postgres redis minio && \
            timeout 120 bash -c 'until docker compose exec -T postgres pg_isready -U rag_admin; do sleep 3; done' && \
            docker compose exec -T postgres bash /migrations/migrate.sh && \
            docker compose build --no-cache canonical-db-api auth-acl-api && \
            docker compose up -d --remove-orphans && \
            docker compose ps"

      - name: Run health checks
        env:
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
        run: |
          sleep 15
          curl -f ${PRODUCTION_URL}/api/canonical-db/health
          curl -f ${PRODUCTION_URL}/api/auth-acl/health

      - name: Diagnostics on failure
        if: failure()
        env:
          SERVER_HOST: ${{ secrets.PRODUCTION_SERVER_HOST }}
          SERVER_USER: ${{ secrets.PRODUCTION_SERVER_USER }}
          DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
        run: |
          # Deliberately does NOT take the stack down: a failed health check
          # should not turn into a full outage. Restore manually if needed:
          #   docker compose exec -T postgres pg_restore -U rag_admin -d enterprise_rag --clean < backups/<ts>/database.dump
          ssh ${SERVER_USER}@${SERVER_HOST} "cd ${DEPLOY_PATH} && docker compose ps -a && \
            docker compose logs --tail=100 canonical-db-api auth-acl-api postgres" || true
          echo "❌ Deployment failed. Services were left running; see logs above and backups/ for restore."
