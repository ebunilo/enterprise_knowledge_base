x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

# Published ports bind to BIND_ADDRESS (default 127.0.0.1). nginx on the host
# proxies to them; Docker-published ports bypass host firewalls such as ufw,
# so binding to 0.0.0.0 would expose PostgreSQL and Redis to the internet.
#
# Services connect to PostgreSQL as the non-superuser role `rag_app` when
# APP_DB_PASSWORD is set, which is what makes Row-Level Security apply
# (superusers bypass RLS). Without it they fall back to the admin role.

services:
  # PostgreSQL 15+ - Canonical Database
  postgres:
    image: postgres:15-alpine
    container_name: enterprise-rag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-enterprise_rag}
      POSTGRES_USER: ${POSTGRES_USER:-rag_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
      PGDATA: /var/lib/postgresql/data/pgdata
      # Consumed by /migrations/migrate.sh to enable the rag_app login.
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - ./postgres/migrations:/migrations:ro
      - ./postgres/conf/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5433}:5432"
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      # TCP, not the socket: during first-boot init the temporary server only
      # listens on the socket, so this stays unhealthy until init + migrations
      # have finished and dependants do not start early.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-rag_admin} -d ${POSTGRES_DB:-enterprise_rag}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - rag_network
    logging: *default-logging

  # MinIO - S3-Compatible Object Storage
  minio:
    image: minio/minio:latest
    container_name: enterprise-rag-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_BROWSER_URL:-http://localhost:9001}
    volumes:
      - minio_data:/data
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${MINIO_API_PORT:-9000}:9000"
      - "${BIND_ADDRESS:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - rag_network
    logging: *default-logging

  # Redis - Caching and Session Management
  redis:
    image: redis:7-alpine
    container_name: enterprise-rag-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
    volumes:
      - redis_data:/data
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - rag_network
    logging: *default-logging

  # Canonical DB Agent API
  canonical-db-api:
    build:
      # ../../services when run from the repo; the deploy workflow sets
      # SERVICES_DIR=./services because it copies services/ next to this file.
      context: ${SERVICES_DIR:-../../services}/canonical-db-agent
      dockerfile: Dockerfile
    container_name: enterprise-rag-canonical-db-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${APP_DB_USER:-rag_admin}:${APP_DB_PASSWORD:-${POSTGRES_PASSWORD}}@postgres:5432/${POSTGRES_DB:-enterprise_rag}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-20}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-30}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      API_WORKERS: ${API_WORKERS:-4}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      SERVICE_API_KEYS: ${SERVICE_API_KEYS:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      AUDIT_STORE_QUERY_TEXT: ${AUDIT_STORE_QUERY_TEXT:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENVIRONMENT: ${ENVIRONMENT:-production}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${CANONICAL_DB_API_PORT:-8001}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - rag_network
    logging: *default-logging

  # Auth ACL Agent API
  auth-acl-api:
    build:
      context: ${SERVICES_DIR:-../../services}/auth-acl-agent
      dockerfile: Dockerfile
    container_name: enterprise-rag-auth-acl-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${APP_DB_USER:-rag_admin}:${APP_DB_PASSWORD:-${POSTGRES_PASSWORD}}@postgres:5432/${POSTGRES_DB:-enterprise_rag}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-20}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-30}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDIS_DB: 1
      CACHE_TTL: ${CACHE_TTL:-300}
      # Keycloak realm URL, e.g. https://auth.igwilo.com/realms/<realm>
      OIDC_PROVIDER_URL: ${OIDC_PROVIDER_URL:?OIDC_PROVIDER_URL is required}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?OIDC_CLIENT_ID is required}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?OIDC_CLIENT_SECRET is required}
      OIDC_AUDIENCES: ${OIDC_AUDIENCES:-}
      EXTERNAL_GROUPS: ${EXTERNAL_GROUPS:-external-users}
      ENFORCE_CLEARANCE: ${ENFORCE_CLEARANCE:-true}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENVIRONMENT: ${ENVIRONMENT:-production}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${AUTH_ACL_API_PORT:-8002}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - rag_network
    logging: *default-logging

networks:
  rag_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
  redis_data:
    driver: local
