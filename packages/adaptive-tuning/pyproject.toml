[project]
name = "adaptive-tuning"
version = "0.1.0"
description = "Guardrailed self-improvement (parameter registry, experiments, rewards, evaluation) for the Enterprise RAG System"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest==7.4.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["adaptive_tuning"]

[tool.pytest.ini_options]
testpaths = ["tests"]
